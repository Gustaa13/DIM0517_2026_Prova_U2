name: Node

on:
  pull_request:
    branches:
      - develop
    types:
      - accepted

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

      - name: Criar tag
        run: | 
          TAG="build-${{ github.run_id }}"
          git tag $TAG

