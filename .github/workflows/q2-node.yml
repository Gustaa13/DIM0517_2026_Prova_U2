name: Node

on:
  pull_request:
    branches:
      - develop
    types:
      - accepted

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

      - name: Testes de modo que o workflow falhe em caso de erro nos testes
        run: npm test
        if: failure()
