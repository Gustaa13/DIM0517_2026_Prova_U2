name: Node

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Check
        run: node --check src/index.js

      - name: Testes de modo que o workflow falhe em caso de erro nos testes
        run: npm test
        if: failure()

      - name: Constroi imagem docker
        run: docker build -t node-app .

      - name: Rodar a imagem docker
        run: docker run --name node-app-container -d -p 8080:8080 node-app